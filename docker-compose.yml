version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: order_db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-order_db}
      POSTGRES_USER: ${DATABASE_USER:-orderuser}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-orderpass}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-orderuser} -d ${DATABASE_NAME:-order_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - order_network
    restart: unless-stopped

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: order_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - order_network
    restart: unless-stopped

  # Order Service
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order_service
    environment:
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-order_db}
      DATABASE_USER: ${DATABASE_USER:-orderuser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-orderpass}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT:-8000}
      EXCHANGE_NAME: ${EXCHANGE_NAME:-order_exchange}
      ORDER_CREATED_QUEUE: ${ORDER_CREATED_QUEUE:-order.created}
      ORDER_PROCESSED_QUEUE: ${ORDER_PROCESSED_QUEUE:-order.processed}
    ports:
      - "${ORDER_SERVICE_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - order_network
    restart: unless-stopped

  # Order Processor Service
  order-processor:
    build:
      context: ./order-processor-service
      dockerfile: Dockerfile
    container_name: order_processor
    environment:
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-order_db}
      DATABASE_USER: ${DATABASE_USER:-orderuser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-orderpass}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      ORDER_PROCESSOR_PORT: ${ORDER_PROCESSOR_PORT:-8001}
      EXCHANGE_NAME: ${EXCHANGE_NAME:-order_exchange}
      ORDER_CREATED_QUEUE: ${ORDER_CREATED_QUEUE:-order.created}
      ORDER_PROCESSED_QUEUE: ${ORDER_PROCESSED_QUEUE:-order.processed}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RETRY_DELAY_SECONDS: ${RETRY_DELAY_SECONDS:-5}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - order_network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification_service
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVICE_PORT:-8002}
      EXCHANGE_NAME: ${EXCHANGE_NAME:-order_exchange}
      ORDER_PROCESSED_QUEUE: ${ORDER_PROCESSED_QUEUE:-order.processed}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RETRY_DELAY_SECONDS: ${RETRY_DELAY_SECONDS:-5}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - order_network
    restart: unless-stopped

  # Inventory Service
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory_service
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT:-8003}
      EXCHANGE_NAME: ${EXCHANGE_NAME:-order_exchange}
      ORDER_CREATED_QUEUE: ${ORDER_CREATED_QUEUE:-order.created}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RETRY_DELAY_SECONDS: ${RETRY_DELAY_SECONDS:-5}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - order_network
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  order_network:
    driver: bridge
